name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: policy-and-render
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: org/Nginx CI
      labels: [self-hosted, linux, x64, makepad, makepad-nginx-ci]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check shell scripts
        run: shellcheck --severity=warning scripts/*.sh
      - name: Validate existing Runtrace proxy policy
        run: ./scripts/test-runtrace-upload-policy.sh
      - name: Validate Brio staging proxy policy
        run: ./scripts/test-brio-staging-policy.sh
