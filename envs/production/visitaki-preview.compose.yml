# Additive overlay: opt in only after the Visitaki API and TLS preflight pass.
configs:
  visitaki_preview_conf:
    file: ./sites/visitaki-preview.conf.template
services:
  nginx:
    configs:
      - source: visitaki_preview_conf
        target: /etc/nginx/templates/visitaki-preview.conf.template
    networks:
      - visitaki_preview_app
networks:
  visitaki_preview_app:
    external: true
    name: ${MAKEPAD_PROXY_VISITAKI_APP_NETWORK:?set Visitaki proxy network}
