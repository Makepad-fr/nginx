server {
    listen 80;
    listen [::]:80;
    server_name consent.makepad.fr;
    access_log /var/log/nginx/access.log runtrace_json;
    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }
    location / { return 503 "Consent Lens is being prepared.\n"; }
}
